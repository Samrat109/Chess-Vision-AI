<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChessVision AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111c2d;
      --panel-hover: #19283a;
      --border: #26384d;
      --green: #34d399;
      --text: #f1f5f9;
      --muted: #9aacc0;
    }

    * { box-sizing: border-box; }

    body {
      width: 380px;
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border: 1px solid #236e60;
      border-radius: 14px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    h1 span { color: var(--green); }

    .subtitle, .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .server {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }

    .dot.online { background: var(--green); }
    .dot.offline { background: #fb7185; }

    .section {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1422;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 62px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--green);
      color: #062b21;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #6ee7b7; }
    button:active { transform: scale(.99); }

    button.secondary {
      border-color: var(--border);
      background: var(--panel-hover);
      color: var(--text);
    }

    button.secondary:hover { border-color: var(--green); }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin-top: 12px;
      color: var(--green);
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .move {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #0b1422;
      overflow-wrap: anywhere;
    }

    .move strong {
      color: var(--green);
      font-size: 15px;
    }

    .move p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    footer {
      padding-top: 15px;
      text-align: center;
      color: #71839a;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <header>
    <img class="brand-icon" src="icons/icon128.png" alt="ChessVision AI icon">
    <div>
      <h1>ChessVision <span>AI</span></h1>
      <div class="subtitle">Your chess. Smarter.</div>
    </div>
  </header>

  <div class="server">
    <span class="dot" id="serverDot"></span>
    <span id="serverStatus">Checking local engine connection...</span>
  </div>

  <section class="section">
    <h2>♟ Analyze a Position</h2>
    <label for="fen">FEN position</label>
    <textarea id="fen" placeholder="Paste a FEN, or leave empty for the starting position"></textarea>
    <button class="secondary" id="syncPosition">
      ↻ Sync Chess.com Analysis Position
   </button>
    <button id="analyze">Analyze Position</button>
    <div id="results"></div>
  </section>

  <section class="section">
    <h2>▤ Review a Saved Game</h2>
    <label for="gameId">Saved game ID</label>
    <input id="gameId" type="number" min="1" value="1">
    <button class="secondary" id="reviewGame">Load Saved Game</button>
    <div id="gameResults"></div>
  </section>

  <button class="secondary" id="openDashboard">Open Full Dashboard ↗</button>

  <div id="status" role="status" aria-live="polite">Ready</div>

  <footer>Powered by Django &amp; Stockfish · For training and game review</footer>

  <script src="popup.js"></script>
</body>
</html>
